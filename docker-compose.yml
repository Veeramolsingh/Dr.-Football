services:
  db:
    image: postgres:16-alpine
    container_name: scout_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout_dev_password
      POSTGRES_DB: football_scout
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d football_scout"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
